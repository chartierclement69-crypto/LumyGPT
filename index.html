<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LumyGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff;
    display:flex;flex-direction:column;height:100dvh;
    /* FOND LÉGER QUI BOUGE - SANS BLUR, ÇA NE RAME PLUS */
    background:linear-gradient(160deg,#2a0a5e 0%, #1a0033 30%, #4c1d95 55%, #0d001f 80%, #08001a 100%);
    background-size:220% 220%;
    animation:bgMove 18s ease-in-out infinite alternate;
    overflow:hidden;
  }
  @keyframes bgMove{0%{background-position:0% 0%}100%{background-position:100% 100%}}
  body.light{background:linear-gradient(160deg,#e9d5ff 0%, #ffffff 35%, #d8b4fe 60%, #f5f0ff 100%);background-size:220% 220%;color:#1a0033}
  body.light header{background:rgba(255,255,255,.82);border-bottom:1px solid rgba(168,85,247,.25)}
  body.light header h1{color:#1a0033;text-shadow:none}
  body.light .subtitle{color:#6d28d9}
  body.light .chip{background:#fff;color:#6d28d9;border:1px solid #e9d5ff}
  body.light .bot-msg{background:#fff;color:#1a0033;border:1px solid #e9d5ff;box-shadow:0 8px 20px rgba(168,85,247,.14)}
  body.light .bot-msg b{color:#6d28d9}
  body.light .time{color:#a78bfa}
  body.light .input-wrap{background:#fff;border:1.5px solid #d8b4fe;box-shadow:0 10px 25px rgba(168,85,247,.2)}
  body.light #input{color:#1a0033}
  body.light #input::placeholder{color:#a78bfa}

  /* SPLASH SIMPLIFIÉ - 1 SEULE ANIM */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%, #3b0a6d 0%, #1a0033 50%, #0a0018 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;animation:splashOut .35s ease 2.2s forwards}
  @keyframes splashOut{to{opacity:0;visibility:hidden}}
  .splash-center{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle, rgba(168,85,247,.6) 0%, transparent 65%)}
  .ring{position:absolute;width:190px;height:190px;border:2px dashed rgba(216,180,254,.7);border-radius:50%;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .splash-logo{position:relative;z-index:2;width:150px;height:150px;border-radius:38px;background:linear-gradient(135deg,#e9d5ff 0%, #a855f7 40%, #6d28d9 100%);display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.6);border:3px solid #fff;box-shadow:0 0 35px #a855f7;animation:logoIn 2.2s ease forwards}
  @keyframes logoIn{0%{transform:scale(1.8);opacity:0}20%{transform:scale(1);opacity:1}80%{transform:scale(1)}100%{transform:scale(.5) translateY(-150px);opacity:0}}
  .splash-title{font-size:40px;font-weight:900;letter-spacing:1px}
  .splash-sub{font-size:12px;color:#e9d5ff;letter-spacing:3px;text-transform:uppercase}
  .splash-bar{width:140px;height:5px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .splash-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#fff);border-radius:99px;animation:loading 1.2s ease .6s forwards}
  @keyframes loading{to{width:100%}} @keyframes fadeIn{to{opacity:1}}

  header{flex-shrink:0;padding:10px 14px 12px;padding-top:calc(6px + env(safe-area-inset-top));text-align:center;background:rgba(20,0,40,.55);border-bottom:1px solid rgba(255,255,255,.12);opacity:0;animation:fadeIn .35s ease 2.3s forwards}
  .top-row{display:flex;justify-content:space-between;align-items:center}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:#a7f3d0;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4);padding:5px 10px;border-radius:999px;font-weight:700}
  .live i{width:7px;height:7px;background:#22c55e;border-radius:50%}
  .badges{display:flex;gap:6px;align-items:center}
  .badge{background:rgba(168,85,247,.25);border:1px solid rgba(216,180,254,.6);color:#fff;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
  .badge-gold{background:linear-gradient(135deg,#fde68a,#facc15);color:#1a1000;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:900}
  .icon-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .logo-wrap{margin:10px auto 4px;width:68px;height:68px;position:relative}
  /* 1 SEUL CARRÉ QUI TOURNE - PLUS LÉGER, PLUS FLUIDE */
  .ring-head{position:absolute;inset:-8px;border:2px solid rgba(216,180,254,.7);border-radius:24px;transform:rotate(12deg);animation:spinSlow 10s linear infinite}
  @keyframes spinSlow{to{transform:rotate(372deg)}}
  .logo{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#e9d5ff 0%, #a855f7 40%, #6d28d9 100%);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;box-shadow:0 0 25px rgba(168,85,247,.7);border:2px solid rgba(255,255,255,.95);will-change:transform}
  /* LE L QUI RÉAGIT QUAND TU TAPES - EN TRANSFORM SEULEMENT, ÇA NE RAME PAS */
  body.typing .logo{transform:scale(1.08) translateY(-4px) rotate(-2deg);box-shadow:0 0 35px #e879f9}
  body.typing .ring-head{animation-duration:1.4s;border-color:#fff}
  body.answering .logo{transform:scale(1.05) translateY(-2px)}
  header h1{font-size:32px;letter-spacing:-.5px;line-height:1;font-weight:800}
  header h1 .grad{background:linear-gradient(90deg,#c084fc,#e9d5ff,#22d3ee,#f472b6,#c084fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .subtitle{font-size:12.5px;color:#d8b4fe;margin-top:4px}
  .chips{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
  .chip:active{transform:scale(.96)}

  #chat{flex:1;overflow-y:auto;padding:14px 12px 12px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;opacity:0;animation:fadeIn .35s ease 2.4s forwards}
  .row{display:flex;gap:9px;align-items:flex-end}
  .row.user{justify-content:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;background:linear-gradient(135deg,#e9d5ff,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:2px solid #fff;flex-shrink:0}
  .avatar.user-av{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border:2px solid #a5f3fc}
  .msg{max-width:82%;padding:13px 15px;border-radius:20px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .bot-msg{background:linear-gradient(135deg, rgba(88,28,135,.92), rgba(76,29,149,.88));border:1px solid rgba(216,180,254,.55);box-shadow:0 8px 20px rgba(0,0,0,.3);border-bottom-left-radius:6px}
  .user-msg{background:linear-gradient(135deg,#8b5cf6,#a855f7);border:1px solid rgba(255,255,255,.25);border-bottom-right-radius:6px}
  .bot-msg b{color:#fff} .bot-msg code{background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;font-size:13px} .bot-msg pre{background:#000;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px}
  .time{font-size:10px;color:rgba(255,255,255,.55);margin-top:5px;text-align:left;padding-left:2px}
  .actions{display:flex;gap:6px;margin-top:6px}
  .action-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;padding:5px 9px;border-radius:999px;cursor:pointer}
  .action-btn.active{background:#22c55e;border-color:#22c55e}
  .action-btn.active-red{background:#ef4444;border-color:#ef4444}

  #form{flex-shrink:0;padding:10px 12px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));opacity:0;animation:fadeIn .35s ease 2.5s forwards}
  .input-wrap{display:flex;align-items:center;gap:10px;background:rgba(18,0,38,.9);border:1.5px solid rgba(216,180,254,.5);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 25px rgba(0,0,0,.4)}
  body.typing .input-wrap{border-color:#f0abfc;box-shadow:0 0 22px rgba(217,70,239,.5)}
  #input{flex:1;background:transparent;border:none;color:#fff;padding:11px 4px;outline:none;font-size:16px;font-family:inherit}
  #input::placeholder{color:#c4b5fd}
  #send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0;box-shadow:0 0 14px #a855f7}
  #send:active{transform:scale(.92)} #send:disabled{opacity:.5}
  .typing{opacity:.7;font-style:italic}
  .cursor{display:inline-block;width:8px;height:15px;background:#e9d5ff;vertical-align:middle;margin-left:2px;animation:blink .7s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-center" id="splashCenter"><div class="halo"></div><div class="ring"></div><div class="splash-logo">L</div></div>
  <div class="splash-title">LumyGPT</div>
  <div class="splash-sub">Votre assistant intelligent</div><div class="splash-bar"><i></i></div>
</div>

<header>
  <div class="top-row">
    <div class="live"><i></i> En ligne</div>
    <div class="badges"><span class="badge">V21</span><span class="badge-gold">👑 PRO</span><button class="icon-btn" id="themeBtn">🌙</button><button class="icon-btn" id="newBtn">🔄</button></div>
  </div>
  <div class="logo-wrap"><div class="ring-head"></div><div class="logo">L</div></div>
  <h1>Lumy<span class="grad">GPT</span></h1>
  <div class="subtitle">Votre assistant intelligent ✨</div>
  <div class="chips">
    <button class="chip" onclick="quickAsk('Donne-moi une idée de vidéo TikTok')">💡 Idée TikTok</button>
    <button class="chip" onclick="quickAsk('Aide-moi pour mon devoir')">📚 Aide devoir</button>
    <button class="chip" onclick="quickAsk('Raconte-moi une blague')">😂 Blague</button>
    <button class="chip" onclick="quickAsk('Fais-moi un planning de révision')">📅 Planning</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <div class="input-wrap">
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button id="send" type="submit">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const splash = document.getElementById('splash');
setTimeout(()=>{ splash.style.display='none'; },2600);

const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{ document.body.classList.toggle('light'); themeBtn.textContent=document.body.classList.contains('light')?'🌞':'🌙'; };
document.getElementById('newBtn').onclick=()=>{ chat.innerHTML=''; addMsg('Nouveau chat ! 👋 Je suis LumyGPT, que veux-tu faire ?', 'bot', true); };

let typingTimeout;
input.addEventListener('focus', ()=>{ document.body.classList.add('typing'); });
input.addEventListener('blur', ()=>{ if(!input.value) document.body.classList.remove('typing'); });
input.addEventListener('input', ()=>{
  if(input.value.trim().length > 0){
    document.body.classList.add('typing');
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{ document.body.classList.remove('typing'); }, 1800);
  } else { document.body.classList.remove('typing'); }
});

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatText(t){
  let s=escapeHtml(t);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/```[\s\S]*?```/g,(m)=>{ const clean=m.replace(/```\w*/,'').replace(/```/,'').trim(); return '<pre>'+clean+'</pre>'; });
  return s;
}
function timeNow(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function typeEffect(el, fullText){
  let i=0; el.innerHTML='';
  const iv=setInterval(()=>{
    i+=4; el.innerHTML=formatText(fullText.slice(0,i))+'<span class="cursor"></span>'; chat.scrollTop=chat.scrollHeight;
    if(i>=fullText.length){ clearInterval(iv); el.innerHTML=formatText(fullText); document.body.classList.remove('answering'); }
  },16);
}
function addMsg(text, who, instant=false){
  const row=document.createElement('div'); row.className='row '+(who==='user'?'user':'');
  if(who==='bot'){
    const av=document.createElement('div'); av.className='avatar'; av.textContent='L';
    const wrap=document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.maxWidth='84%';
    const div=document.createElement('div'); div.className='msg bot-msg';
    const t=document.createElement('div'); t.className='time'; t.textContent='LumyGPT • '+timeNow();
    const actions=document.createElement('div'); actions.className='actions';
    const copy=document.createElement('button'); copy.className='action-btn'; copy.textContent='📋 Copier';
    copy.onclick=()=>{ navigator.clipboard.writeText(text); copy.textContent='✅ Copié !'; setTimeout(()=>copy.textContent='📋 Copier',1500); };
    const like=document.createElement('button'); like.className='action-btn'; like.textContent='❤️';
    like.onclick=()=>{ like.classList.toggle('active'); dislike.classList.remove('active-red'); };
    const dislike=document.createElement('button'); dislike.className='action-btn'; dislike.textContent='👎';
    dislike.onclick=()=>{ dislike.classList.toggle('active-red'); like.classList.remove('active'); };
    actions.append(copy,like,dislike);
    wrap.append(div); wrap.append(t); wrap.append(actions); row.append(av); row.append(wrap);
    chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
    if(instant){ div.innerHTML=formatText(text); } else { document.body.classList.add('answering'); typeEffect(div, text); }
    return row;
  } else {
    const div=document.createElement('div'); div.className='msg user-msg'; div.innerHTML=formatText(text);
    const av=document.createElement('div'); av.className='avatar user-av'; av.textContent='Z';
    row.append(div); row.append(av); chat.appendChild(row); chat.scrollTop=chat.scrollHeight; return row;
  }
}
function quickAsk(q){ input.value=q; input.dispatchEvent(new Event('input')); form.dispatchEvent(new Event('submit')); }
addMsg('Bonjour 👋 Je suis LumyGPT, ton assistant intelligent.\nQue veux-tu faire aujourd\'hui ?', 'bot', true);
form.onsubmit=async(e)=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text) return;
  document.body.classList.remove('typing');
  addMsg(text,'user'); input.value=''; send.disabled=true;
  const typingRow=addMsg('LumyGPT écrit...','bot',true);
  typingRow.querySelector('.msg').classList.add('typing');
  document.body.classList.add('answering');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await r.json(); typingRow.remove(); document.body.classList.remove('answering'); addMsg(data.reply||'Pas de réponse bg, réessaie.','bot');
  }catch(err){ typingRow.remove(); document.body.classList.remove('answering'); addMsg('Erreur bg, réessaie.','bot'); }
  send.disabled=false;
};
</script>
</body>
</html>
