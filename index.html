<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LumyGPT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:Arial,sans-serif;color:#fff;
    background:#0a0018;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(168,85,247,.55), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(139,92,246,.45), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(168,85,247,.6), transparent 50%),
      linear-gradient(180deg,#1a0033 0%, #0d001f 45%, #05000f 100%);
    /* Ça c'est le secret pour que le clavier iPhone déplace pas tout */
    height:100dvh;
    height:100svh;
  }

  /* ===== HAUT FIXE - BOUGE JAMAIS ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:12px 14px 10px;
    padding-top:calc(12px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(26,0,51,.98) 0%, rgba(13,0,31,.95) 70%, rgba(13,0,31,0) 100%);
    text-align:center;
  }
  .top-row{display:flex;justify-content:flex-end;gap:8px;align-items:center}
  .badge{background:#2a0a4a;border:1px solid #a855f7;color:#fff;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
  .badge-gold{background:#3a2a00;border:1px solid #facc15;color:#facc15;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
  .online{font-size:12px;color:#c084fc;margin-top:4px;text-align:right}
  .online i{color:#22c55e;font-style:normal}
  .logo-wrap{margin:4px auto 2px;width:64px;height:64px;position:relative}
  .logo{
    width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#a855f7,#6d28d9);
    display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;
    box-shadow:0 0 25px #a855f7, 0 0 50px #7c3aed;border:2px solid #d8b4fe;
  }
  .ring{position:absolute;inset:-7px;border:2px solid rgba(216,180,254,.7);border-radius:22px;transform:rotate(12deg)}
  header h1{font-size:30px;letter-spacing:.5px}
  header h1 span{color:#c084fc}
  .subtitle{font-size:13px;color:#e9d5ff;opacity:.9;margin-top:1px}
  .subtitle::before,.subtitle::after{content:" — ";color:#a855f7}

  /* ===== MILIEU - C'EST LE SEUL QUI SCROLL ===== */
  #chat{
    position:fixed;left:0;right:0;z-index:1;
    /* On laisse la place pour le haut et le bas */
    top:182px;
    bottom:78px;
    overflow-y:auto;
    padding:10px 12px 12px;
    display:flex;flex-direction:column;gap:14px;
    -webkit-overflow-scrolling:touch;
  }
  .row{display:flex;gap:10px;align-items:flex-end}
  .row.user{justify-content:flex-end}
  .avatar{
    width:36px;height:36px;min-width:36px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
    border:2px solid #a855f7;box-shadow:0 0 12px #a855f7;flex-shrink:0;
  }
  .avatar.user-av{background:#111;border:2px solid #22d3ee;color:#fff;box-shadow:0 0 10px #22d3ee}
  .msg{max-width:82%;padding:13px 15px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .bot-msg{background:linear-gradient(135deg, rgba(88,28,135,.95), rgba(76,29,149,.95));border:1px solid #a855f7;box-shadow:0 0 18px rgba(168,85,247,.45);border-bottom-left-radius:6px}
  .user-msg{background:linear-gradient(135deg,#7c3aed,#a855f7);border-bottom-right-radius:6px;box-shadow:0 0 15px rgba(168,85,247,.5)}
  .bot-msg b{color:#fff}
  .bot-msg code{background:#000;padding:2px 6px;border-radius:6px;font-size:13px}
  .bot-msg pre{background:#000;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px}

  /* ===== BAS FIXE - BOUGE JAMAIS ===== */
  #form{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(5,0,15,.98) 60%, transparent 100%);
  }
  .input-wrap{
    display:flex;align-items:center;gap:10px;
    background:rgba(20,0,40,.95);border:2px solid #a855f7;border-radius:999px;padding:6px 6px 6px 8px;
    box-shadow:0 0 20px rgba(168,85,247,.6), inset 0 0 15px rgba(168,85,247,.25);
  }
  #plus{width:36px;height:36px;border-radius:50%;background:#a855f7;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
  #input{flex:1;background:transparent;border:none;color:#fff;padding:10px 4px;outline:none;font-size:15px}
  #input::placeholder{color:#c4b5fd}
  #send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 0 15px #a855f7}
  #send:disabled{opacity:.5}
  .typing{opacity:.7;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <span class="badge">V12.3</span>
    <span class="badge-gold">👑 PRO</span>
  </div>
  <div class="online"><i>●</i> En ligne</div>
  <div class="logo-wrap"><div class="ring"></div><div class="logo">L</div></div>
  <h1>Lumy<span>GPT</span></h1>
  <div class="subtitle">Votre assistant intelligent</div>
</header>

<div id="chat"></div>

<form id="form">
  <div class="input-wrap">
    <button type="button" id="plus">+</button>
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button id="send" type="submit">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function escapeHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatText(t){
  let s = escapeHtml(t);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/```[\s\S]*?```/g, (m)=>{
    const clean = m.replace(/```\w*/,'').replace(/```/,'').trim();
    return '<pre>' + clean + '</pre>';
  });
  return s;
}
function addMsg(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'user' ? 'user' : '');
  if(who === 'bot'){
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = 'L';
    const div = document.createElement('div');
    div.className = 'msg bot-msg'; div.innerHTML = formatText(text);
    row.appendChild(av); row.appendChild(div);
  } else {
    const div = document.createElement('div');
    div.className = 'msg user-msg'; div.innerHTML = formatText(text);
    const av = document.createElement('div');
    av.className = 'avatar user-av'; av.textContent = 'Z';
    row.appendChild(div); row.appendChild(av);
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

addMsg('Bonjour, je suis une intelligence artificielle, que puis-je faire pour vous ?', 'bot');

form.onsubmit = async (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  send.disabled = true;
  const typingRow = addMsg('LumyGPT écrit...', 'bot');
  typingRow.querySelector('.msg').classList.add('typing');
  try{
    const r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text})
    });
    const data = await r.json();
    typingRow.remove();
    addMsg(data.reply || 'Pas de réponse bg, réessaie.', 'bot');
  }catch(err){
    typingRow.remove();
    addMsg('Erreur bg, réessaie.', 'bot');
  }
  send.disabled = false;
  input.focus();
};
document.getElementById('plus').onclick = ()=>{ input.focus(); };

// Petit fix iPhone : quand le clavier s'ouvre, on reste en bas de la conv
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    chat.scrollTop = chat.scrollHeight;
  });
}
</script>
</body>
</html>
