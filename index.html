<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumyGPT</title>
<style>body{background:#0f0f0f;color:white;font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}header{padding:15px;text-align:center;font-weight:900;font-size:22px}header span{color:#a855f7}#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{max-width:80%;padding:10px 14px;border-radius:15px}.user{background:#a855f7;align-self:flex-end}.bot{background:#222;align-self:flex-start}#bar{display:flex;padding:12px;gap:8px}input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:white;outline:none}button{padding:12px 18px;border-radius:20px;border:none;background:#a855f7;color:white;font-weight:900}</style>
</head><body>
<header>💜 LUMY<span>GPT</span> - V12.3 PRO</header>
<div id="chat"></div>
<div id="bar"><input id="input" placeholder="Écris à LumyGPT..."><button onclick="send()">➤</button></div>
<script>
async function send(){
let inp=document.getElementById('input');let txt=inp.value;if(!txt)return;
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user">${txt}</div>`;inp.value='';
let div=document.createElement('div');div.className='msg bot';div.textContent='Lumy réfléchit...';chat.appendChild(div);
let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});
let d=await r.json();div.textContent=d.reply;chat.scrollTop=chat.scrollHeight;
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
