<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>LumyGPT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
  html{background:#0a0530;overscroll-behavior:none}
  body{
    background:#0a0530;color:white;
    display:flex;flex-direction:column;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top);
  }
  header{flex-shrink:0;height:76px;min-height:76px;padding:10px 14px;display:flex;align-items:center;gap:10px;background:#0a0530;z-index:20}
  .logo{width:52px;height:52px;background:linear-gradient(135deg,#3b82f6,#a855f7);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:26px;line-height:1;flex-shrink:0}
  .logo span{font-size:7px;letter-spacing:.5px}
  .title{font-size:30px;font-weight:900;color:#7dd3fc;letter-spacing:1px;flex:1}
  .badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .badges-top{display:flex;gap:6px}
  .v{background:#16a34a;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pro{background:#eab308;color:black;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800}
  .gratuit{background:#2563eb;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .online{font-size:12px;color:#22c55e;font-weight:700}
  .chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row.me{justify-content:flex-end}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .avatar.me{border:2px solid #22d3ee;background:#0a0530}
  .bubble{background:#1e1b4b;padding:12px 14px;border-radius:16px;max-width:82%;font-size:15px;line-height:1.45;word-break:break-word}
  .bubble.me{background:linear-gradient(135deg,#7c3aed,#3b82f6)}
  .input-bar{flex-shrink:0;padding:12px;padding-bottom:max(12px, env(safe-area-inset-bottom));background:#0a0530;z-index:20;display:flex;gap:8px;align-items:center}
  .input-wrap{flex:1;display:flex;align-items:center;gap:10px;background:#1e1b4b;border:2px solid #7c3aed;border-radius:999px;padding:6px 6px 6px 8px}
  .plus{width:36px;height:36px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .input-wrap input{flex:1;background:transparent;border:none;outline:none;color:white;font-size:16px;min-width:0}
  .input-wrap input::placeholder{color:#a78bfa}
  .send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#3b82f6);border:none;color:white;font-size:18px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div class="logo">L<span>LumyGPT</span></div>
  <div class="title">LUMYGPT</div>
  <div class="badges">
    <div class="badges-top"><span class="v">V12.3</span><span class="pro">PRO</span></div>
    <div style="display:flex;gap:6px;align-items:center"><span class="gratuit">GRATUIT</span><span class="online">● En ligne</span></div>
  </div>
</header>

<div class="chat" id="chat">
  <div class="row"><div class="avatar">L</div><div class="bubble">Bonjour, je suis une intelligence artificielle, que puis-je faire pour vous ?</div></div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <div class="plus">+</div>
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button class="send" onclick="send()">➤</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

async function send(){
  const txt = input.value.trim();
  if(!txt) return;
  chat.innerHTML += `<div class="row me"><div class="bubble me">${txt}</div><div class="avatar me">Z</div></div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  // Petit message "en train d'écrire..."
  const typingId = 'typing-' + Date.now();
  chat.innerHTML += `<div class="row" id="${typingId}"><div class="avatar">L</div><div class="bubble">...</div></div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const rep = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: txt })
    });
    const data = await rep.json();
    document.getElementById(typingId)?.remove();
    chat.innerHTML += `<div class="row"><div class="avatar">L</div><div class="bubble">${data.reply || 'Erreur, réessaie bg'}</div></div>`;
  } catch(e) {
    document.getElementById(typingId)?.remove();
    chat.innerHTML += `<div class="row"><div class="avatar">L</div><div class="bubble">Erreur de connexion à GROQ, réessaie.</div></div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

document.addEventListener('touchmove', e=>{
  if(e.target.closest('.chat')) return;
  if(e.target.closest('input')) return;
  e.preventDefault();
}, {passive:false});
</script>

</body>
</html>
