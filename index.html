<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumyGPT</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#0a0a12;color:white;display:flex;flex-direction:column;height:100vh}
  header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#11111f;border-bottom:1px solid #2a2a44}
  header h1{margin:0;font-size:22px}
  header h1 span{color:#B45CFF}
  .btn-tiktok{background:#000;border:1px solid #fff;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:bold}
  .btn-tiktok img{width:20px;height:20px;vertical-align:middle;border-radius:50%;margin-right:6px}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:80%;padding:12px 14px;border-radius:16px;line-height:1.4}
  .user{align-self:flex-end;background:#B45CFF}
  .bot{align-self:flex-start;background:#1e1e32}
  #bar{display:flex;gap:8px;padding:12px;background:#11111f}
  #bar input{flex:1;padding:12px;border-radius:999px;border:none;outline:none;background:#22223a;color:white}
  #bar button{padding:12px 18px;border-radius:999px;border:none;background:#B45CFF;color:white;font-weight:bold;cursor:pointer}

  /* ====== ECRAN TIKTOK ====== */
  #tiktokScreen{display:none;position:fixed;inset:0;background:#000;z-index:99;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  #tiktokScreen.show{display:flex}
  .anim-logo{
    width:180px;height:auto;border-radius:24px;
    filter:drop-shadow(0 0 30px #B45CFF);
    animation:spinPop .9s ease forwards;
  }
  @keyframes spinPop{
    0%{transform:scale(0) rotate(-180deg);opacity:0}
    60%{transform:scale(1.15) rotate(10deg);opacity:1}
    100%{transform:scale(1) rotate(0deg);opacity:1}
  }
  .tiktok-title{font-size:32px;font-weight:900;margin-top:18px}
  .tiktok-title span{color:#25F4EE}
  .tiktok-title b{color:#FE2C55}
  .tiktok-sub{opacity:.8;margin-top:8px}
  .tiktok-idea{background:#1a1a2e;padding:14px 16px;border-radius:16px;margin:18px 16px 0;max-width:420px}
  .btn-back{margin-top:20px;background:white;color:black;border:none;padding:12px 20px;border-radius:999px;font-weight:bold;cursor:pointer}
  .burst{position:absolute;width:14px;height:14px;border-radius:50%;animation:burst 1s ease-out forwards}
  @keyframes burst{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
  }
</style>
</head>
<body>

<header>
  <h1>Lumy<span>GPT</span></h1>
  <button class="btn-tiktok" id="openTikTok">
    <img src="logo-tiktok.png" alt="TikTok"> Idée TikTok
  </button>
</header>

<div id="chat">
  <div class="msg bot">Salut bg ! Pose-moi une question, ou clique sur Idée TikTok en haut 👊</div>
</div>

<div id="bar">
  <input id="input" placeholder="Écris ici...">
  <button id="send">Envoyer</button>
</div>

<!-- ECRAN TIKTOK -->
<div id="tiktokScreen">
  <div id="burstZone"></div>
  <img class="anim-logo" src="logo-tiktok.png" alt="LumyGPT TikTok">
  <div class="tiktok-title">LumyGPT <span>Tik</span><b>Tok</b></div>
  <div class="tiktok-sub">Ton idée TikTok qui va percer 🔥</div>
  <div class="tiktok-idea" id="tiktokIdea">Chargement de ton idée...</div>
  <button class="btn-back" id="closeTikTok">⬅ Retour au chat</button>
</div>

<script>
  // ====== TA CLÉ GROQ - C'EST ICI, 1 SEULE ======
  const GROQ_KEY = "COLLE_TA_CLE_ICI";

  async function askGroq(msgs){
    // Si t'es sur Vercel, il passe par /api/chat (clé cachée)
    try{
      const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})});
      if(r.ok){
        const d = await r.json();
        const txt = d.choices?.[0]?.message?.content || "";
        if(txt && txt.length > 20) return txt;
      }
    }catch(e){}

    // Sinon il utilise ta clé directe
    if(!GROQ_KEY || GROQ_KEY.includes("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")) return null;
    try{
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:msgs,temperature:0.8,max_tokens:1000})
      });
      const d = await r.json();
      return d.choices?.[0]?.message?.content || null;
    }catch(e){ return null; }
  }

  // ====== CHAT ======
  const chat=document.getElementById("chat");
  const input=document.getElementById("input");
  function addMsg(text,who){
    const d=document.createElement("div");
    d.className="msg "+who; d.textContent=text;
    chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
    return d;
  }
  async function send(){
    const t=input.value.trim(); if(!t) return;
    addMsg(t,"user"); input.value="";
    const loading=addMsg("LumyGPT réfléchit...","bot");
    const rep=await askGroq([{role:"user",content:t}]);
    loading.textContent = rep || "Ça a coupé bg, on a mangé les 1000 messages, reviens demain 👊";
  }
  document.getElementById("send").onclick=send;
  input.addEventListener("keydown",e=>{if(e.key==="Enter") send()});

  // ====== MODE TIKTOK ======
  const screen=document.getElementById("tiktokScreen");
  const burstZone=document.getElementById("burstZone");
  const ideaEl=document.getElementById("tiktokIdea");

  document.getElementById("openTikTok").onclick=async()=>{
    screen.classList.add("show");
    ideaEl.textContent="Chargement de ton idée...";
    burstZone.innerHTML="";
    const colors=["#25F4EE","#FE2C55","#B45CFF","#ffffff"];
    for(let i=0;i<40;i++){
      const b=document.createElement("div");
      b.className="burst";
      b.style.background=colors[i%colors.length];
      b.style.setProperty("--x",(Math.random()*400-200)+"px");
      b.style.setProperty("--y",(Math.random()*400-200)+"px");
      b.style.left="50%"; b.style.top="40%";
      burstZone.appendChild(b);
    }
    const rep=await askGroq([{role:"user",content:"Donne-moi 1 idée TikTok super originale, drôle, qui peut percer, en 3 phrases max, avec un hook. Style jeune, direct."}]);
    ideaEl.textContent = rep || "Idée du jour : Filme-toi en train de montrer LumyGPT à tes potes et leur réaction 😂";
  };
  document.getElementById("closeTikTok").onclick=()=>{ screen.classList.remove("show"); };
</script>
</body>
</html>
