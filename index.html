<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumyGPT by ZENNOX69</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#0a0a0f;color:white;height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.logo{width:38px;height:38px;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
header h1{font-size:20px} header h1 span{color:#a855f7}
header p{font-size:12px;color:#888}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.user{background:#a855f7;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1c1c26;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #2a2a3a}
.welcome{text-align:center;margin-top:40px;color:#aaa}
.welcome h2{color:white;font-size:26px;margin-bottom:8px}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.sug button{background:#1c1c26;border:1px solid #333;color:white;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.input-area{padding:14px;display:flex;gap:10px;border-top:1px solid #222;background:#0a0a0f}
input{flex:1;background:#1c1c26;border:1px solid #333;color:white;padding:14px 16px;border-radius:25px;outline:none;font-size:15px}
button.send{background:#a855f7;border:none;color:white;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer}
#keyBox{padding:10px 20px;background:#1a1a00;border-bottom:1px solid #333;display:flex;gap:8px}
#keyBox input{font-size:12px;padding:8px 12px}
#keyBox button{background:#333;color:white;border:none;padding:8px 12px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<header><div class="logo">✨</div><div><h1>Lumy<span>GPT</span></h1><p>par ZENNOX69 • En ligne</p></div></header>
<div id="keyBox"><input id="apiKey" type="password" placeholder="Colle ta clé Groq ici (gratuite)"><button onclick="saveKey()">Sauver</button></div>
<div id="chat"><div class="welcome"><h2>Salut bg, c'est Lumy ✨</h2><p>Pose-moi n'importe quelle question</p><div class="sug"><button onclick="ask('Explique-moi les maths simplement')">📐 Maths</button><button onclick="ask('Aide-moi pour un exposé')">📚 Exposé</button><button onclick="ask('Donne-moi une idée de business')">💡 Business</button><button onclick="ask('Ecris-moi une histoire')">📖 Histoire</button></div></div></div>
<div class="input-area"><input id="input" placeholder="Ecris ton message..." onkeypress="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>
<script>
let key = localStorage.getItem('groq') || '';
if(key) document.getElementById('apiKey').value = key;
function saveKey(){ key = document.getElementById('apiKey').value.trim(); localStorage.setItem('groq',key); alert('Clé sauvée bg !'); }
function ask(t){ document.getElementById('input').value=t; send(); }
async function send(){
  let inp = document.getElementById('input'); let text = inp.value.trim(); if(!text) return;
  if(!key){ alert('Mets ta clé Groq en haut d’abord bg, sinon je peux pas répondre ! Va sur console.groq.com'); return; }
  let chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${text}</div>`; inp.value='';
  let id = 'm'+Date.now(); chat.innerHTML += `<div class="msg ai" id="${id}">Lumy réfléchit...</div>`; chat.scrollTop = chat.scrollHeight;
  try{
    let r = await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:'Tu es LumyGPT, une IA cool, fun, qui parle comme un pote bg, en français, tu aides pour tout.'},{role:'user',content:text}]})});
    let d = await r.json(); document.getElementById(id).innerText = d.choices[0].message.content;
  }catch(e){ document.getElementById(id).innerText = 'Oups bg, erreur. Vérifie ta clé Groq.'; }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
