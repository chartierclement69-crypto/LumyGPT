<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LumyGPT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#17002e;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
/* ===== TOPBAR ===== */
.topbar{display:flex;gap:6px;padding:10px 10px 6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;background:#17002e}
.topbar::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;font-size:12px;padding:7px 11px;border-radius:999px;background:#2a0a4a;border:1px solid #4a1a7a}
.pill.pro{background:#ffcc00;color:#000;font-weight:800;border-color:#ffcc00}
.pill.ghost{margin-left:auto}
/* ===== BASE LUMYGPT - PHOTO 3 ===== */
#basePage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#2d0050 0%,#17002e 55%,#0d001a 100%)}
.hero{text-align:center;padding:6px 12px 4px}
.logoL{width:78px;height:78px;margin:2px auto;background:linear-gradient(135deg,#c86bff,#7a00ff);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;box-shadow:0 0 0 3px #fff,0 0 30px #B45CFF,0 0 60px #B45CFF}
.hero h1{margin:10px 0 0;font-size:40px;line-height:1;letter-spacing:-1px}
.hero h1 span{color:#c86bff}
.hero p{margin:6px 0 12px;font-size:14px;opacity:.9}
.rowBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid #6a2db3;background:#2a0a4a;color:#fff;padding:10px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.btn.main{background:#7a00e6;border-color:#a35cff}
.chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msgRow{display:flex;gap:8px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;background:#B45CFF;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex-shrink:0;border:1px solid rgba(255,255,255,.6)}
.av.small{width:22px;height:22px;font-size:12px;margin-top:2px}
.bubble{background:#3d0a7a;padding:13px 14px;border-radius:16px;max-width:82%;line-height:1.4;font-size:16px;white-space:pre-line}
.meta{font-size:11px;opacity:.6;margin:5px 0 0 46px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 46px}
.tool{background:#1e003a;border:1px solid #4a1a7a;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;cursor:pointer}
.tool.red{color:#ff5c7a}
/* ===== BAR CLAVIER ===== */
.bar{display:flex;gap:10px;align-items:center;padding:12px;background:#17002e;border-top:1px solid #2a0a4a}
.barInput{flex:1;display:flex;align-items:center;gap:10px;background:#1e003a;border:1px solid #5a2aa0;border-radius:999px;padding:11px 14px}
.barInput input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px}
.barInput input::placeholder{color:#c9a8e8}
.send{width:44px;height:44px;border-radius:50%;border:none;background:#a855ff;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
/* ===== SPLASH TIKTOK - PHOTO 2 ===== */
#splashTik{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
#splashTik.show{display:flex}
.splashBg{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#2a00ff 0%,#7a00ff 20%,#ff2c8a 45%,transparent 70%),radial-gradient(circle at 20% 80%,#00e5ff 0%,transparent 40%),radial-gradient(circle at 80% 80%,#ff00aa 0%,transparent 40%);opacity:.9;animation:explode .7s ease}
@keyframes explode{0%{transform:scale(.4);opacity:0}100%{transform:scale(1.2);opacity:.9}}
.tikBig{position:relative;z-index:2;width:280px;height:280px;display:flex;align-items:center;justify-content:center;animation:popTik .8s cubic-bezier(.2,1.5,.3,1)}
@keyframes popTik{0%{transform:scale(.2) rotate(-12deg)}60%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1)}}
.tikBig svg{width:100%;height:100%;filter:drop-shadow(0 0 25px #25F4EE) drop-shadow(0 0 40px #FE2C55)}
.splashTxt{position:relative;z-index:2;text-align:center;padding-bottom:34px}
.splashTxt h2{margin:0;font-size:52px;line-height:.9;font-weight:900;color:#e8c8ff;text-shadow:0 0 20px #ff5ce1}
.splashTxt p{margin:8px 0 0;opacity:.8}
/* ===== PAGE TIKTOK - PHOTO 4 ===== */
#tikPage{flex:1;display:none;flex-direction:column;overflow:hidden;background:#000}
#tikPage.show{display:flex}
.tikHead{display:flex;align-items:center;gap:10px;padding:12px 12px 4px;background:#000}
.tikHead svg{width:62px;height:62px;flex-shrink:0}
.tikHead h2{margin:0;font-size:34px;line-height:.95}
.tikHead h2 span{color:#ff5ce1}
.tikHead .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#1a1a2e;color:#ff5ce1;border:none;font-size:20px;cursor:pointer}
.tikPills{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
.tikPills::-webkit-scrollbar{display:none}
.tikPills button{white-space:nowrap;background:#000;border:1px solid #fff;color:#fff;padding:9px 12px;border-radius:999px;font-size:12px;cursor:pointer}
.tikPills button.on{background:#fff;color:#000}
.chatTik{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.bubbleTik{background:#0a0a1a;border:1px solid #ff2c8a;padding:14px;border-radius:18px;line-height:1.45;font-size:15px;white-space:pre-line}
.barTik{background:#000;border-top:1px solid #222}
.barTik .barInput{background:#0a0a1a;border-color:#333}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ===== PAGE BASE - PHOTO 3 ===== -->
<div id="basePage">
  <div class="topbar">
    <span class="pill">🟢 En ligne</span><span class="pill">v2.5</span><span class="pill pro">🔥 PRO</span><span class="pill">🔥 1</span><span class="pill">⭐ 0</span><span class="pill">🌙</span><span class="pill">🔄</span>
  </div>
  <div class="hero">
    <div class="logoL">L</div>
    <h1>Lumy<span>GPT</span></h1>
    <p>Bon après-midi ✨ • Ton assistant intelligent ✨</p>
    <div class="rowBtns">
      <button class="btn main" onclick="openTikTok()">💡 Idée TikTok</button>
      <button class="btn" onclick="quick('Aide devoir')">📚 Aide devoir</button>
      <button class="btn" onclick="quick('Blague')">😂 Blague</button>
    </div>
    <div class="rowBtns" style="margin-top:8px"><button class="btn" onclick="quick('Planning')">📅 Planning</button></div>
  </div>
  <div class="chat" id="chatBase"></div>
  <div class="bar">
    <div class="barInput"><span>⚡</span><span>📷</span><input id="inputBase" placeholder="Écris à LumyGPT..."></div>
    <button class="send" onclick="sendBase()">➤</button>
  </div>
</div>

<!-- ===== SPLASH TIKTOK - PHOTO 2 ===== -->
<div id="splashTik">
  <div class="splashBg"></div>
  <div class="tikBig">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25F4EE"/><stop offset=".5" stop-color="#a855ff"/><stop offset="1" stop-color="#FE2C55"/></linearGradient></defs><path fill="url(#g)" stroke="#fff" stroke-width="1.5" d="M62 8 L62 62 A18 18 0 1 1 44 62 L44 8 L62 8 Z M62 8 L78 18 L78 34 L62 30 Z"/></svg>
  </div>
  <div class="splashTxt"><h2>LumyGPT<br>TikTok</h2><p>Ça va percer 🔥</p></div>
</div>

<!-- ===== PAGE TIKTOK - PHOTO 4 ===== -->
<div id="tikPage">
  <div class="topbar" style="background:#000"><span class="pill" style="background:#111">🟢 En ligne</span><span class="pill" style="background:#111">v2.5</span><span class="pill pro">🔥 PRO</span><span class="pill" style="background:#111">🔥 1</span><span class="pill" style="background:#111">⭐ 0</span><span class="pill" style="background:#111">🌙</span><span class="pill" style="background:#111">🔄</span></div>
  <div class="tikHead">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25F4EE"/><stop offset="1" stop-color="#FE2C55"/></linearGradient></defs><path fill="url(#g2)" d="M62 8 L62 62 A18 18 0 1 1 44 62 L44 8 L62 8 Z M62 8 L78 18 L78 34 L62 30 Z"/></svg>
    <h2>LumyGPT<br><span>TikTok</span></h2>
    <button class="x" onclick="closeTikTok()">✕</button>
  </div>
  <div class="tikPills">
    <button onclick="tikBtn('trend',this)">🔥 Trend du moment</button>
    <button onclick="tikBtn('idee',this)">Idée vidéo virale</button>
    <button onclick="tikBtn('script',this)">🕒 Script 15 sec</button>
    <button onclick="tikBtn('percer',this)">Comment percer</button>
    <button onclick="tikBtn('bio',this)">✨ Bio qui tue</button>
  </div>
  <div class="chatTik" id="chatTik"></div>
  <div class="bar barTik">
    <div class="barInput"><span>⚡</span><span>📷</span><input id="inputTik" placeholder="Écris à Lumy TikTok..."></div>
    <button class="send" onclick="sendTik()">➤</button>
  </div>
</div>

<script>
let likes=128;
function bubble(container,text,tiktok){
  const row=document.createElement("div"); row.className="msgRow";
  const av=document.createElement("div"); av.className="av"; av.textContent=tiktok?"🎵":"L";
  if(tiktok) av.style.background="#000";
  const col=document.createElement("div"); col.style.flex="1";
  const b=document.createElement("div"); b.className=tiktok?"bubbleTik":"bubble"; b.textContent=text;
  const meta=document.createElement("div"); meta.className="meta"; meta.textContent=(tiktok?"Lumy TikTok":"LumyGPT")+" • "+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const tools=document.createElement("div"); tools.className="tools";
  const mk=(t,fn)=>{let x=document.createElement("button"); x.className="tool"; x.textContent=t; x.onclick=fn; tools.append(x); return x};
  mk("📋 Copier",e=>{navigator.clipboard.writeText(text); e.target.textContent="✅ Copié"});
  let l=mk("❤️ "+likes,()=>{likes++; l.textContent="❤️ "+likes});
  if(tiktok) l.textContent="❤️ 128";
  mk("💬 Modifier",()=>{b.textContent=b.textContent+" 🔥 (modifié)"});
  mk("🔊 Écouter",()=>{speechSynthesis.speak(new SpeechSynthesisUtterance(text))});
  mk("⭐ Favori",e=>{e.target.textContent="⭐ Ajouté"});
  if(!tiktok){ let d=document.createElement("button"); d.className="tool red"; d.textContent="👎"; tools.append(d); }
  col.append(b,meta,tools); row.append(av,col); container.append(row); container.scrollTop=container.scrollHeight; return b;
}
function userBubble(container,t){
  let d=document.createElement("div"); d.style.cssText="align-self:flex-end;background:#B45CFF;padding:12px 14px;border-radius:14px;max-width:85%"; d.textContent=t; container.append(d); container.scrollTop=container.scrollHeight;
}
const chatBase=document.getElementById("chatBase");
const chatTik=document.getElementById("chatTik");
const inputBase=document.getElementById("inputBase");
const inputTik=document.getElementById("inputTik");
bubble(chatBase,"Bon après-midi ✨ Je suis LumyGPT.\nQue veux-tu faire ?",false);

function sendBase(){
  let t=inputBase.value.trim(); if(!t) return; userBubble(chatBase,t); inputBase.value="";
  let load=bubble(chatBase,"LumyGPT écrit...",false);
  setTimeout(()=>{load.textContent=repBase(t)},600);
}
function repBase(q){
  q=q.toLowerCase();
  if(q.includes("devoir")) return "Vas-y envoie ton devoir bg, je t'aide direct 📚 C'est quoi le sujet ?";
  if(q.includes("blague")) return "Pourquoi les plongeurs plongent en arrière ? Parce que sinon ils tombent dans le bateau 😂";
  if(q.includes("planning")) return "Ton planning : 1 vidéo TikTok, 30 min devoirs, puis chill. Tu veux que je détaille ?";
  if(q.includes("tiktok")) return "Clique sur Idée TikTok en haut bg 🔥";
  return "Ah ouais bg ? Raconte-moi plus 😏 Tu veux une idée TikTok, aide devoir, blague ou planning ?";
}
inputBase.addEventListener("keydown",e=>{if(e.key==="Enter") sendBase()});
function quick(t){ inputBase.value=t; sendBase(); }

// ===== FLOW TIKTOK : BASE -> SPLASH PHOTO 2 -> PAGE PHOTO 4 =====
function openTikTok(){
  document.getElementById("splashTik").classList.add("show");
  setTimeout(()=>{
    document.getElementById("splashTik").classList.remove("show");
    document.getElementById("basePage").style.display="none";
    document.getElementById("tikPage").classList.add("show");
    if(chatTik.children.length===0){
      bubble(chatTik,"Bonjour, je suis LumyGPT TikTok,\nje suis là pour t'aider sur TikTok.\n\n① \"3 hacks iPhone que 99% ignorent\" - Hook accrocheur + démonstration rapide à l'écran, tendance sons Tech.\n\n② \"Routine matinale 15s\" - Transition virale au réveil, texte dynamique + musique tendance.\n\n③ \"POV : quand ton café devient aesthetic\" - Style lifestyle, texte + effet glitch rose/bleu.\n\nTu veux que je te rédige le script complet pour l'idée 1 ?",true);
    }
    inputTik.focus();
  },2200);
}
function closeTikTok(){
  document.getElementById("tikPage").classList.remove("show");
  document.getElementById("basePage").style.display="flex";
}
function sendTik(){
  let t=inputTik.value.trim(); if(!t) return; userBubble(chatTik,t); inputTik.value="";
  let load=bubble(chatTik,"Lumy TikTok écrit...",true);
  setTimeout(()=>{load.textContent=repTik(t)},600);
}
function repTik(q){
  q=q.toLowerCase();
  if(q.includes("script")||q.includes("idée 1")||q.includes("idee 1")) return "SCRIPT 15 SEC - Idée 1 :\n[0-2s] \"Tu connais pas ce hack iPhone...\"\n[2-8s] Tu montres l'écran\n[8-13s] Réaction choquée\n[13-15s] \"Abonne-toi sinon tu rates le 2ème\" 🔥";
  return "Ok bg, pour percer : Hook 2 sec qui choque, vidéo courte, poste tous les jours. Tu veux Trend, Idée virale, Script 15 sec, Comment percer ou Bio ?";
}
inputTik.addEventListener("keydown",e=>{if(e.key==="Enter") sendTik()});
function tikBtn(type,btn){
  document.querySelectorAll(".tikPills button").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
  const txt={
    trend:"🔥 TREND DU MOMENT :\nSon Tech + transition rapide. Tout le monde fait le \"POV : mon tel il sait tout\". Fais-le avec LumyGPT.",
    idee:"💡 IDÉE VIDÉO VIRALE :\n\"J'ai demandé à LumyGPT de contrôler ma journée\" - Hook : \"Mon IA elle m'a démonté\"",
    script:"🕒 SCRIPT 15 SEC :\n[0-2s] \"Regarde ça...\"\n[2-7s] Tu montres LumyGPT\n[7-12s] Réaction\n[12-15s] \"Commente PARTIE 2\"",
    percer:"🚀 COMMENT PERCER :\n1. Hook 2 sec\n2. Vidéo < 20 sec\n3. Poste 1x / jour\n4. Réponds aux coms les 30 premières min",
    bio:"✨ BIO QUI TUE :\n\"Je teste les IA pour que tu perces 🔥 | Nouvelle idée chaque jour | Abonne-toi 👇\""
  };
  bubble(chatTik,txt[type],true);
}
</script>
</body>
</html>
