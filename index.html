<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>LumyGPT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro",Arial,sans-serif;color:#fff;
    display:flex;flex-direction:column;height:100dvh;
    background:#08001a;
    background-image:
      radial-gradient(circle at 15% 5%, rgba(192,38,211,.6), transparent 38%),
      radial-gradient(circle at 90% 15%, rgba(139,92,246,.6), transparent 42%),
      radial-gradient(circle at 50% 110%, rgba(168,85,247,.65), transparent 50%),
      linear-gradient(180deg,#1e003a 0%, #0d001f 45%, #05000f 100%);
    background-attachment:fixed;
  }

  /* ===== SPLASH V13 - ON GARDE LE MEILLEUR ===== */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 50%, #3b0a6d 0%, #1a0033 45%, #0a0018 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;animation:splashOut .4s ease 2.8s forwards;perspective:800px}
  #splash::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .3s ease .05s forwards, flash2 .25s ease 2.45s forwards}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  @keyframes flash2{0%{opacity:.8}100%{opacity:0}}
  .splash-center{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle, rgba(168,85,247,.8) 0%, transparent 65%);animation:haloPulse .8s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.3);opacity:1}}
  .shock{position:absolute;width:170px;height:170px;border-radius:50%;border:4px solid #e9d5ff;opacity:0;animation:shockWave 1s ease-out .45s forwards, shockWave 1s ease-out 1.6s forwards}
  @keyframes shockWave{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  .ring1{position:absolute;width:210px;height:210px;border:3px dashed rgba(216,180,254,.9);border-radius:50%;animation:spin 3s linear infinite}
  .ring2{position:absolute;width:260px;height:260px;border:2px solid rgba(168,85,247,.5);border-radius:50%;animation:spinRev 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}
  .splash-logo{position:relative;z-index:2;width:175px;height:175px;border-radius:44px;background:linear-gradient(135deg,#fff 0%, #d8b4fe 15%, #a855f7 40%, #6d28d9 75%, #4c1d95 100%);display:flex;align-items:center;justify-content:center;font-size:135px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 20px #fff, 0 0 40px #a855f7; border:4px solid #fff;box-shadow:0 0 30px #fff, 0 0 70px #a855f7, 0 0 140px #7c3aed;animation:logoMax 2.8s cubic-bezier(.2,1.4,.3,1) forwards}
  @keyframes logoMax{0%{transform:scale(2.4) rotateY(180deg) rotate(-20deg);opacity:0;filter:blur(10px)}12%{transform:scale(1.25) rotateY(0deg) rotate(5deg);opacity:1;filter:blur(0)}22%{transform:scale(1) rotate(0deg)}32%{transform:translateY(0) scale(1.08,.92)}40%{transform:translateY(-35px) scale(.95,1.05)}48%{transform:translateY(0) scale(1.06,.94)}56%{transform:translateY(-18px) scale(.97,1.03)}64%{transform:translateY(0) scale(1)}72%{transform:translateY(-8px)}80%{transform:translateY(0) scale(1.05) rotate(-2deg)}90%{transform:scale(.95) rotate(3deg)}100%{transform:scale(0) rotate(360deg) translateY(-180px);opacity:0;filter:blur(6px)}}
  .particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#e9d5ff;box-shadow:0 0 12px #a855f7;animation:particleFly 1.1s ease-out .4s forwards;opacity:0}
  .particle2{position:absolute;width:6px;height:6px;border-radius:50%;background:#facc15;box-shadow:0 0 10px #facc15;animation:particleFly 1.1s ease-out 1.6s forwards;opacity:0}
  @keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x), var(--y)) scale(0)}}
  .confetti{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 2s ease-in 1s forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(520px) rotate(720deg)}}
  .splash-title{font-size:44px;font-weight:900;letter-spacing:2px;min-height:52px;display:flex;gap:1px}
  .splash-title span{opacity:0;animation:letterPop .35s cubic-bezier(.2,1.8,.3,1) forwards;display:inline-block}
  .splash-title span:nth-child(1){animation-delay:1s;color:#fff}.splash-title span:nth-child(2){animation-delay:1.1s;color:#e9d5ff}.splash-title span:nth-child(3){animation-delay:1.2s;color:#d8b4fe}.splash-title span:nth-child(4){animation-delay:1.3s;color:#c084fc}.splash-title span:nth-child(5){animation-delay:1.45s;color:#a855f7;text-shadow:0 0 15px #a855f7}.splash-title span:nth-child(6){animation-delay:1.6s;color:#c084fc}.splash-title span:nth-child(7){animation-delay:1.75s;color:#e9d5ff}
  @keyframes letterPop{0%{opacity:0;transform:translateY(25px) scale(.5) rotate(-10deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  .splash-sub{font-size:13px;color:#e9d5ff;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:fadeIn .5s ease 1.9s forwards}
  .splash-bar{width:160px;height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;opacity:0;animation:fadeIn .3s ease 1.6s forwards}
  .splash-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#facc15,#fff);border-radius:99px;animation:loading 1s ease 1.6s forwards}
  @keyframes loading{to{width:100%}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes splashOut{to{opacity:0;visibility:hidden}}

  /* ===== NOUVEAU HEADER GLASS ===== */
  header{
    flex-shrink:0;padding:12px 14px 12px;padding-top:calc(8px + env(safe-area-inset-top));
    text-align:center;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.12);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    opacity:0;animation:fadeIn .4s ease 2.9s forwards;
  }
  .top-row{display:flex;justify-content:space-between;align-items:center}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:#a7f3d0;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);padding:5px 9px;border-radius:999px;font-weight:700}
  .live i{width:7px;height:7px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .badges{display:flex;gap:6px}
  .badge{background:rgba(168,85,247,.2);border:1px solid #a855f7;color:#fff;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}
  .badge-gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1a1000;border:none;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900;box-shadow:0 0 14px rgba(250,204,21,.6)}
  .logo-wrap{margin:10px auto 4px;width:72px;height:72px;position:relative}
  .logo{
    width:72px;height:72px;border-radius:22px;
    background:linear-gradient(135deg,#e9d5ff 0%, #a855f7 35%, #6d28d9 75%, #3b0a6d 100%);
    display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;
    box-shadow:0 0 20px #fff, 0 0 35px #a855f7, 0 0 70px #7c3aed;border:2px solid rgba(255,255,255,.9);
    animation:floatLogo 3s ease-in-out infinite;
  }
  @keyframes floatLogo{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-2deg)}}
  .ring{position:absolute;inset:-8px;border:2px solid rgba(216,180,254,.7);border-radius:26px;transform:rotate(12deg);animation:spinSlow 8s linear infinite}
  @keyframes spinSlow{to{transform:rotate(372deg)}}
  header h1{font-size:32px;letter-spacing:.5px;line-height:1;text-shadow:0 2px 20px rgba(168,85,247,.8)}
  header h1 span{background:linear-gradient(90deg,#c084fc,#e9d5ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitle{font-size:12.5px;color:#d8b4fe;opacity:.95;margin-top:4px;letter-spacing:.3px}
  /* Petits boutons suggestions */
  .chips{display:flex;gap:8px;justify-content:center;margin-top:11px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(10px);transition:transform .15s, background .15s;
  }
  .chip:active{transform:scale(.94);background:rgba(168,85,247,.35)}

  /* ===== CHAT PLUS STYLÉ ===== */
  #chat{flex:1;overflow-y:auto;padding:14px 12px 12px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch;opacity:0;animation:fadeIn .4s ease 3s forwards}
  .row{display:flex;gap:10px;align-items:flex-end;animation:msgIn .3s ease both}
  @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .row.user{justify-content:flex-end}
  .avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:linear-gradient(135deg,#e9d5ff,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;border:2px solid #fff;box-shadow:0 0 14px #a855f7, 0 0 30px rgba(168,85,247,.6);flex-shrink:0;animation:floatLogo 3s ease-in-out infinite}
  .avatar.user-av{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border:2px solid #a5f3fc;box-shadow:0 0 14px #22d3ee;animation:none}
  .msg{max-width:84%;padding:13px 15px;border-radius:20px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word;position:relative}
  .bot-msg{
    background:linear-gradient(135deg, rgba(88,28,135,.95), rgba(76,29,149,.9));
    border:1px solid rgba(216,180,254,.55);
    box-shadow:0 8px 25px rgba(0,0,0,.35), 0 0 22px rgba(168,85,247,.45);
    border-bottom-left-radius:6px;
    backdrop-filter:blur(10px);
  }
  .user-msg{
    background:linear-gradient(135deg,#8b5cf6,#a855f7);
    border:1px solid rgba(255,255,255,.25);
    border-bottom-right-radius:6px;
    box-shadow:0 8px 22px rgba(168,85,247,.45);
  }
  .bot-msg b{color:#fff}
  .bot-msg code{background:#000;padding:2px 6px;border-radius:6px;font-size:13px}
  .bot-msg pre{background:#000;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px}
  .time{font-size:10px;color:rgba(255,255,255,.55);margin-top:4px;text-align:right}

  /* ===== BARRE DU BAS FLOTTANTE ===== */
  #form{flex-shrink:0;padding:10px 12px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:transparent;opacity:0;animation:fadeIn .4s ease 3.1s forwards}
  .input-wrap{
    display:flex;align-items:center;gap:10px;
    background:rgba(20,0,40,.88);backdrop-filter:blur(20px);
    border:1.5px solid rgba(168,85,247,.8);border-radius:999px;padding:6px 6px 6px 8px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 25px rgba(168,85,247,.55), inset 0 0 18px rgba(168,85,247,.22);
  }
  .input-wrap:focus-within{border-color:#e9d5ff;box-shadow:0 0 0 3px rgba(168,85,247,.35), 0 0 35px #a855f7}
  #plus{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#a855f7);border:none;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;box-shadow:0 0 12px #a855f7}
  #input{flex:1;background:transparent;border:none;color:#fff;padding:11px 4px;outline:none;font-size:15px}
  #input::placeholder{color:#c4b5fd}
  #send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1,#22d3ee);border:none;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0;box-shadow:0 0 16px #a855f7;transition:transform .15s}
  #send:active{transform:scale(.9) rotate(-10deg)}
  #send:disabled{opacity:.5}
  .typing{opacity:.7;font-style:italic}
  .dots::after{content:"...";animation:dots 1s infinite}
  @keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-center" id="splashCenter">
    <div class="halo"></div><div class="shock"></div><div class="ring2"></div><div class="ring1"></div><div class="splash-logo">L</div>
  </div>
  <div class="splash-title"><span>L</span><span>u</span><span>m</span><span>y</span><span>G</span><span>P</span><span>T</span></div>
  <div class="splash-sub">Votre assistant intelligent</div>
  <div class="splash-bar"><i></i></div>
</div>

<header>
  <div class="top-row">
    <div class="live"><i></i> En ligne</div>
    <div class="badges"><span class="badge">V14</span><span class="badge-gold">👑 PRO</span></div>
  </div>
  <div class="logo-wrap"><div class="ring"></div><div class="logo">L</div></div>
  <h1>Lumy<span>GPT</span></h1>
  <div class="subtitle">Votre assistant intelligent ✨</div>
  <div class="chips">
    <button class="chip" onclick="quickAsk('Donne-moi une idée de vidéo TikTok')">💡 Idée TikTok</button>
    <button class="chip" onclick="quickAsk('Aide-moi pour mon devoir')">📚 Aide devoir</button>
    <button class="chip" onclick="quickAsk('Raconte-moi une blague')">😂 Blague</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <div class="input-wrap">
    <button type="button" id="plus">+</button>
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button id="send" type="submit">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const splash = document.getElementById('splash');
const splashCenter = document.getElementById('splashCenter');
const colors = ['#e9d5ff','#a855f7','#facc15','#22d3ee','#fff','#c084fc'];
for(let i=0;i<22;i++){
  const p = document.createElement('div'); p.className = i%2 ? 'particle' : 'particle2';
  const angle = (i / 22) * Math.PI * 2; const dist = 120 + Math.random()*90;
  p.style.setProperty('--x', Math.cos(angle)*dist + 'px'); p.style.setProperty('--y', Math.sin(angle)*dist + 'px');
  p.style.width = (4 + Math.random()*9) + 'px'; p.style.height = p.style.width; splashCenter.appendChild(p);
}
for(let i=0;i<24;i++){
  const c = document.createElement('div'); c.className = 'confetti';
  c.style.left = Math.random()*100 + '%'; c.style.background = colors[i % colors.length];
  c.style.animationDelay = (0.9 + Math.random()*0.8) + 's'; c.style.animationDuration = (1.6 + Math.random()) + 's'; splash.appendChild(c);
}
setTimeout(()=>{ splash.style.display='none'; }, 3300);

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatText(t){
  let s = escapeHtml(t);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/```[\s\S]*?```/g, (m)=>{ const clean = m.replace(/```\w*/,'').replace(/```/,'').trim(); return '<pre>' + clean + '</pre>'; });
  return s;
}
function timeNow(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function addMsg(text, who){
  const row = document.createElement('div'); row.className = 'row ' + (who === 'user' ? 'user' : '');
  if(who === 'bot'){
    const av = document.createElement('div'); av.className = 'avatar'; av.textContent = 'L';
    const wrap = document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.maxWidth='84%';
    const div = document.createElement('div'); div.className = 'msg bot-msg'; div.innerHTML = formatText(text);
    const t = document.createElement('div'); t.className='time'; t.textContent='LumyGPT • '+timeNow();
    wrap.appendChild(div); wrap.appendChild(t); row.appendChild(av); row.appendChild(wrap);
  } else {
    const div = document.createElement('div'); div.className = 'msg user-msg'; div.innerHTML = formatText(text);
    const av = document.createElement('div'); av.className = 'avatar user-av'; av.textContent = 'Z';
    row.appendChild(div); row.appendChild(av);
  }
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight; return row;
}
function quickAsk(q){ input.value=q; form.dispatchEvent(new Event('submit')); }
addMsg('Bonjour 👋 Je suis LumyGPT, ton assistant intelligent.\nQue veux-tu faire aujourd\'hui ?', 'bot');
form.onsubmit = async (e)=>{
  e.preventDefault();
  const text = input.value.trim(); if(!text) return;
  addMsg(text, 'user'); input.value = ''; send.disabled = true;
  const typingRow = addMsg('LumyGPT écrit', 'bot');
  typingRow.querySelector('.msg').classList.add('typing','dots');
  try{
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const data = await r.json(); typingRow.remove(); addMsg(data.reply || 'Pas de réponse bg, réessaie.', 'bot');
  }catch(err){ typingRow.remove(); addMsg('Erreur bg, réessaie.', 'bot'); }
  send.disabled = false;
};
document.getElementById('plus').onclick = ()=>{ input.focus(); };
</script>
</body>
</html>
