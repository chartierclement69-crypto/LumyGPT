<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>LumyGPT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:Arial,sans-serif;color:#fff;
    display:flex;flex-direction:column;height:100dvh;
    background:#0a0018;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(168,85,247,.55), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(139,92,246,.45), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(168,85,247,.6), transparent 50%),
      linear-gradient(180deg,#1a0033 0%, #0d001f 45%, #05000f 100%);
  }

  /* ===== SPLASH V13 ULTRA MAX ===== */
  #splash{
    position:fixed;inset:0;z-index:100;
    background:radial-gradient(circle at 50% 50%, #3b0a6d 0%, #1a0033 45%, #0a0018 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;
    animation:splashOut .4s ease 2.8s forwards;
    perspective:800px;
  }
  #splash::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .3s ease .05s forwards, flash2 .25s ease 2.45s forwards}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  @keyframes flash2{0%{opacity:.8}100%{opacity:0}}

  .splash-center{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle, rgba(168,85,247,.8) 0%, transparent 65%);animation:haloPulse .8s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.3);opacity:1}}
  /* Onde de choc BOUM */
  .shock{position:absolute;width:170px;height:170px;border-radius:50%;border:4px solid #e9d5ff;opacity:0;animation:shockWave 1s ease-out .45s forwards, shockWave 1s ease-out 1.6s forwards}
  @keyframes shockWave{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  .ring1{position:absolute;width:210px;height:210px;border:3px dashed rgba(216,180,254,.9);border-radius:50%;animation:spin 3s linear infinite}
  .ring2{position:absolute;width:260px;height:260px;border:2px solid rgba(168,85,247,.5);border-radius:50%;animation:spinRev 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}

  .splash-logo{
    position:relative;z-index:2;width:175px;height:175px;border-radius:44px;
    background:linear-gradient(135deg,#fff 0%, #d8b4fe 15%, #a855f7 40%, #6d28d9 75%, #4c1d95 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:135px;font-weight:900;line-height:1;color:#fff;
    text-shadow:0 0 20px #fff, 0 0 40px #a855f7, 0 0 80px #fff;
    border:4px solid #fff;
    box-shadow:0 0 30px #fff, 0 0 70px #a855f7, 0 0 140px #7c3aed, 0 0 200px #a855f7;
    animation:logoMax 2.8s cubic-bezier(.2,1.4,.3,1) forwards;
  }
  @keyframes logoMax{
    0%{transform:scale(2.4) rotateY(180deg) rotate(-20deg);opacity:0;filter:blur(10px)}
    12%{transform:scale(1.25) rotateY(0deg) rotate(5deg);opacity:1;filter:blur(0)}
    22%{transform:scale(1) rotate(0deg)}
    32%{transform:translateY(0) scale(1.08, .92)} /* on écrase pour rebond */
    40%{transform:translateY(-35px) scale(.95,1.05)}
    48%{transform:translateY(0) scale(1.06, .94)}
    56%{transform:translateY(-18px) scale(.97,1.03)}
    64%{transform:translateY(0) scale(1)}
    72%{transform:translateY(-8px)}
    80%{transform:translateY(0) scale(1.05) rotate(-2deg)}
    90%{transform:scale(.95) rotate(3deg)}
    100%{transform:scale(0) rotate(360deg) translateY(-180px);opacity:0;filter:blur(6px)}
  }

  .particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#e9d5ff;box-shadow:0 0 12px #a855f7;animation:particleFly 1.1s ease-out .4s forwards;opacity:0}
  .particle2{position:absolute;width:6px;height:6px;border-radius:50%;background:#facc15;box-shadow:0 0 10px #facc15;animation:particleFly 1.1s ease-out 1.6s forwards;opacity:0}
  @keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x), var(--y)) scale(0)}}
  /* Confettis qui tombent */
  .confetti{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 2s ease-in 1s forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(520px) rotate(720deg)}}

  .splash-title{font-size:44px;font-weight:900;letter-spacing:2px;min-height:52px;display:flex;gap:1px}
  .splash-title span{opacity:0;animation:letterPop .35s cubic-bezier(.2,1.8,.3,1) forwards;display:inline-block}
  .splash-title span:nth-child(1){animation-delay:1s;color:#fff}
  .splash-title span:nth-child(2){animation-delay:1.1s;color:#e9d5ff}
  .splash-title span:nth-child(3){animation-delay:1.2s;color:#d8b4fe}
  .splash-title span:nth-child(4){animation-delay:1.3s;color:#c084fc}
  .splash-title span:nth-child(5){animation-delay:1.45s;color:#a855f7;text-shadow:0 0 15px #a855f7}
  .splash-title span:nth-child(6){animation-delay:1.6s;color:#c084fc}
  .splash-title span:nth-child(7){animation-delay:1.75s;color:#e9d5ff}
  @keyframes letterPop{0%{opacity:0;transform:translateY(25px) scale(.5) rotate(-10deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  .splash-sub{font-size:13px;color:#e9d5ff;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:fadeIn .5s ease 1.9s forwards}
  .splash-bar{width:160px;height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;opacity:0;animation:fadeIn .3s ease 1.6s forwards}
  .splash-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#facc15,#fff);border-radius:99px;animation:loading 1s ease 1.6s forwards}
  @keyframes loading{to{width:100%}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes splashOut{to{opacity:0;visibility:hidden}}

  header{flex-shrink:0;padding:12px 14px 10px;padding-top:calc(8px + env(safe-area-inset-top));text-align:center;background:rgba(13,0,31,.6);opacity:0;animation:fadeIn .4s ease 2.9s forwards}
  .top-row{display:flex;justify-content:flex-end;gap:8px;align-items:center}
  .badge{background:#2a0a4a;border:1px solid #a855f7;color:#fff;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
  .badge-gold{background:#3a2a00;border:1px solid #facc15;color:#facc15;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
  .online{font-size:12px;color:#c084fc;margin-top:4px;text-align:right}
  .online i{color:#22c55e;font-style:normal}
  .logo-wrap{margin:4px auto 2px;width:64px;height:64px;position:relative}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;box-shadow:0 0 25px #a855f7, 0 0 50px #7c3aed;border:2px solid #d8b4fe}
  .ring{position:absolute;inset:-7px;border:2px solid rgba(216,180,254,.7);border-radius:22px;transform:rotate(12deg)}
  header h1{font-size:30px;letter-spacing:.5px}
  header h1 span{color:#c084fc}
  .subtitle{font-size:13px;color:#e9d5ff;opacity:.9;margin-top:1px}
  .subtitle::before,.subtitle::after{content:" — ";color:#a855f7}
  #chat{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;opacity:0;animation:fadeIn .4s ease 3s forwards}
  .row{display:flex;gap:10px;align-items:flex-end}
  .row.user{justify-content:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:2px solid #a855f7;box-shadow:0 0 12px #a855f7;flex-shrink:0}
  .avatar.user-av{background:#111;border:2px solid #22d3ee;color:#fff;box-shadow:0 0 10px #22d3ee}
  .msg{max-width:82%;padding:13px 15px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .bot-msg{background:linear-gradient(135deg, rgba(88,28,135,.95), rgba(76,29,149,.95));border:1px solid #a855f7;box-shadow:0 0 18px rgba(168,85,247,.45);border-bottom-left-radius:6px}
  .user-msg{background:linear-gradient(135deg,#7c3aed,#a855f7);border-bottom-right-radius:6px;box-shadow:0 0 15px rgba(168,85,247,.5)}
  .bot-msg b{color:#fff}
  .bot-msg code{background:#000;padding:2px 6px;border-radius:6px;font-size:13px}
  .bot-msg pre{background:#000;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px}
  #form{flex-shrink:0;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(5,0,15,.6);opacity:0;animation:fadeIn .4s ease 3.1s forwards}
  .input-wrap{display:flex;align-items:center;gap:10px;background:rgba(20,0,40,.95);border:2px solid #a855f7;border-radius:999px;padding:6px 6px 6px 8px;box-shadow:0 0 20px rgba(168,85,247,.6), inset 0 0 15px rgba(168,85,247,.25)}
  #plus{width:36px;height:36px;border-radius:50%;background:#a855f7;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
  #input{flex:1;background:transparent;border:none;color:#fff;padding:10px 4px;outline:none;font-size:15px}
  #input::placeholder{color:#c4b5fd}
  #send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 0 15px #a855f7}
  #send:disabled{opacity:.5}
  .typing{opacity:.7;font-style:italic}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-center" id="splashCenter">
    <div class="halo"></div>
    <div class="shock"></div>
    <div class="ring2"></div>
    <div class="ring1"></div>
    <div class="splash-logo">L</div>
  </div>
  <div class="splash-title"><span>L</span><span>u</span><span>m</span><span>y</span><span>G</span><span>P</span><span>T</span></div>
  <div class="splash-sub">Votre assistant intelligent</div>
  <div class="splash-bar"><i></i></div>
</div>

<header>
  <div class="top-row"><span class="badge">V12.3</span><span class="badge-gold">👑 PRO</span></div>
  <div class="online"><i>●</i> En ligne</div>
  <div class="logo-wrap"><div class="ring"></div><div class="logo">L</div></div>
  <h1>Lumy<span>GPT</span></h1>
  <div class="subtitle">Votre assistant intelligent</div>
</header>

<div id="chat"></div>

<form id="form">
  <div class="input-wrap">
    <button type="button" id="plus">+</button>
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button id="send" type="submit">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const splash = document.getElementById('splash');
const splashCenter = document.getElementById('splashCenter');
const colors = ['#e9d5ff','#a855f7','#facc15','#22d3ee','#fff','#c084fc'];

// Particules explosion x2
for(let i=0;i<22;i++){
  const p = document.createElement('div');
  p.className = i%2 ? 'particle' : 'particle2';
  const angle = (i / 22) * Math.PI * 2;
  const dist = 120 + Math.random()*90;
  p.style.setProperty('--x', Math.cos(angle)*dist + 'px');
  p.style.setProperty('--y', Math.sin(angle)*dist + 'px');
  p.style.width = (4 + Math.random()*9) + 'px';
  p.style.height = p.style.width;
  splashCenter.appendChild(p);
}
// Confettis qui tombent de partout
for(let i=0;i<24;i++){
  const c = document.createElement('div');
  c.className = 'confetti';
  c.style.left = Math.random()*100 + '%';
  c.style.background = colors[i % colors.length];
  c.style.animationDelay = (0.9 + Math.random()*0.8) + 's';
  c.style.animationDuration = (1.6 + Math.random()) + 's';
  splash.appendChild(c);
}
setTimeout(()=>{ splash.style.display='none'; }, 3300);

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatText(t){
  let s = escapeHtml(t);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/```[\s\S]*?```/g, (m)=>{ const clean = m.replace(/```\w*/,'').replace(/```/,'').trim(); return '<pre>' + clean + '</pre>'; });
  return s;
}
function addMsg(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'user' ? 'user' : '');
  if(who === 'bot'){
    const av = document.createElement('div'); av.className = 'avatar'; av.textContent = 'L';
    const div = document.createElement('div'); div.className = 'msg bot-msg'; div.innerHTML = formatText(text);
    row.appendChild(av); row.appendChild(div);
  } else {
    const div = document.createElement('div'); div.className = 'msg user-msg'; div.innerHTML = formatText(text);
    const av = document.createElement('div'); av.className = 'avatar user-av'; av.textContent = 'Z';
    row.appendChild(div); row.appendChild(av);
  }
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight; return row;
}
addMsg('Bonjour, je suis une intelligence artificielle, que puis-je faire pour vous ?', 'bot');
form.onsubmit = async (e)=>{
  e.preventDefault();
  const text = input.value.trim(); if(!text) return;
  addMsg(text, 'user'); input.value = ''; send.disabled = true;
  const typingRow = addMsg('LumyGPT écrit...', 'bot');
  typingRow.querySelector('.msg').classList.add('typing');
  try{
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const data = await r.json(); typingRow.remove(); addMsg(data.reply || 'Pas de réponse bg, réessaie.', 'bot');
  }catch(err){ typingRow.remove(); addMsg('Erreur bg, réessaie.', 'bot'); }
  send.disabled = false;
};
document.getElementById('plus').onclick = ()=>{ input.focus(); };
</script>
</body>
</html>
