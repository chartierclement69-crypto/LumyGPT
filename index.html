<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LumyGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    background:
      radial-gradient(circle at 15% 5%, rgba(192,38,211,.45) 0%, transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(139,92,246,.45) 0%, transparent 42%),
      radial-gradient(circle at 50% 110%, rgba(217,70,239,.38) 0%, transparent 45%),
      linear-gradient(180deg,#1e003a 0%, #0d001f 45%, #05000f 100%);
    background-size:130% 130%;
    animation:bgNuance 16s ease-in-out infinite alternate;
  }
  @keyframes bgNuance{0%{background-position:0% 0%}100%{background-position:100% 100%}}
  body.light{background:radial-gradient(circle at 15% 5%, rgba(168,85,247,.25) 0%, transparent 40%),radial-gradient(circle at 90% 15%, rgba(192,38,211,.2) 0%, transparent 42%),linear-gradient(180deg,#ffffff 0%, #f3e8ff 60%, #e9d5ff 100%);background-size:130% 130%;color:#1a0033}
  body.light header{background:rgba(255,255,255,.82);border-bottom:1px solid rgba(168,85,247,.25)}
  body.light header h1{color:#1a0033;text-shadow:none}
  body.light .subtitle{color:#6d28d9}
  body.light .chip{background:#fff;color:#6d28d9;border:1px solid #e9d5ff;box-shadow:0 4px 14px rgba(168,85,247,.12)}
  body.light .bot-msg{background:#fff;color:#1a0033;border:1px solid #e9d5ff;box-shadow:0 10px 25px rgba(168,85,247,.15)}
  body.light .bot-msg b{color:#6d28d9}
  body.light .time{color:#a78bfa}
  body.light .input-wrap{background:#fff;border:1.5px solid #d8b4fe;box-shadow:0 12px 30px rgba(168,85,247,.22)}
  body.light #input{color:#1a0033}
  body.light #input::placeholder{color:#a78bfa}

  .snow{position:fixed;top:-10px;border-radius:50%;background:#e9d5ff;pointer-events:none;z-index:0;opacity:.7;animation:snowFall linear infinite}
  @keyframes snowFall{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(105vh) translateX(30px);opacity:0}}
  .spark{position:fixed;width:4px;height:4px;background:#fff;border-radius:50%;z-index:0;pointer-events:none;opacity:0;animation:sparkle 3s ease-in-out infinite}
  @keyframes sparkle{0%,100%{opacity:0;transform:translateY(0) scale(.5)}50%{opacity:.9;transform:translateY(-12px) scale(1.2)}}
  .spark.s1{left:12%;top:22%}.spark.s2{left:88%;top:18%;animation-delay:.6s}.spark.s3{left:78%;top:55%;animation-delay:1.1s}.spark.s4{left:8%;top:62%;animation-delay:1.5s}.spark.s5{left:48%;top:12%;animation-delay:.3s;width:3px;height:3px}.spark.s6{left:65%;top:78%;animation-delay:2s}

  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 50%, #3b0a6d 0%, #1a0033 45%, #0a0018 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;animation:splashOut .4s ease 2.6s forwards}
  #splash::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .3s ease .05s forwards}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}} @keyframes splashOut{to{opacity:0;visibility:hidden}}
  .splash-center{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle, rgba(168,85,247,.65) 0%, transparent 65%);animation:haloPulse 1s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{transform:scale(.88);opacity:.6}50%{transform:scale(1.2);opacity:.95}}
  .shock{position:absolute;width:170px;height:170px;border-radius:50%;border:3px solid #e9d5ff;opacity:0;animation:shockWave 1s ease-out .45s forwards}
  @keyframes shockWave{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}
  .ring1{position:absolute;width:210px;height:210px;border:3px dashed rgba(216,180,254,.85);border-radius:50%;animation:spin 4s linear infinite}
  .ring2{position:absolute;width:255px;height:255px;border:2px solid rgba(168,85,247,.45);border-radius:50%;animation:spinRev 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}} @keyframes spinRev{to{transform:rotate(-360deg)}}
  .splash-logo{position:relative;z-index:2;width:165px;height:165px;border-radius:42px;background:linear-gradient(135deg,#fff 0%, #d8b4fe 15%, #a855f7 40%, #6d28d9 75%, #4c1d95 100%);display:flex;align-items:center;justify-content:center;font-size:125px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 20px #fff, 0 0 40px #a855f7;border:4px solid #fff;box-shadow:0 0 30px #fff, 0 0 70px #a855f7, 0 0 120px #7c3aed;animation:logoMax 2.6s cubic-bezier(.2,1.4,.3,1) forwards}
  @keyframes logoMax{0%{transform:scale(2.2) rotate(-15deg);opacity:0}15%{transform:scale(1.2) rotate(4deg);opacity:1}28%{transform:scale(1) rotate(0)}40%{transform:translateY(-28px)}50%{transform:translateY(0)}60%{transform:translateY(-12px)}70%{transform:translateY(0)}100%{transform:scale(0) rotate(360deg) translateY(-170px);opacity:0}}
  .particle{position:absolute;width:7px;height:7px;border-radius:50%;background:#e9d5ff;box-shadow:0 0 10px #a855f7;opacity:0;animation:particleFly 1.1s ease-out .4s forwards}
  @keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x), var(--y)) scale(0)}}
  .confetti{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;opacity:0;animation:fall 1.9s ease-in .9s forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(520px) rotate(680deg)}}
  .splash-title{font-size:42px;font-weight:900;letter-spacing:1px;display:flex}
  .splash-title span{opacity:0;animation:letterPop .35s cubic-bezier(.2,1.8,.3,1) forwards;display:inline-block}
  .splash-title span:nth-child(1){animation-delay:.9s;color:#fff}.splash-title span:nth-child(2){animation-delay:1s;color:#e9d5ff}.splash-title span:nth-child(3){animation-delay:1.1s;color:#d8b4fe}.splash-title span:nth-child(4){animation-delay:1.2s;color:#c084fc}.splash-title span:nth-child(5){animation-delay:1.35s;color:#a855f7}.splash-title span:nth-child(6){animation-delay:1.5s;color:#c084fc}.splash-title span:nth-child(7){animation-delay:1.65s;color:#e9d5ff}
  @keyframes letterPop{0%{opacity:0;transform:translateY(22px) scale(.5)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .splash-sub{font-size:12px;color:#e9d5ff;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:fadeIn .5s ease 1.8s forwards}
  .splash-bar{width:150px;height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;opacity:0;animation:fadeIn .3s ease 1.5s forwards}
  .splash-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#facc15,#fff);border-radius:99px;animation:loading 1s ease 1.5s forwards}
  @keyframes loading{to{width:100%}} @keyframes fadeIn{to{opacity:1}}

  header{flex-shrink:0;padding:10px 14px 12px;padding-top:calc(6px + env(safe-area-inset-top));text-align:center;background:rgba(20,0,40,.55);border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:2;opacity:0;animation:fadeIn .35s ease 2.7s forwards}
  header::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#a855f7,#e9d5ff,#22d3ee,transparent);background-size:200% 100%;animation:shineLine 3s linear infinite}
  @keyframes shineLine{to{background-position:200% 0}}
  .top-row{display:flex;justify-content:space-between;align-items:center}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:#a7f3d0;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4);padding:5px 10px;border-radius:999px;font-weight:700}
  .live i{width:7px;height:7px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e}
  .badges{display:flex;gap:6px;align-items:center}
  .badge{background:rgba(168,85,247,.25);border:1px solid rgba(216,180,254,.6);color:#fff;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
  .badge-gold{background:linear-gradient(135deg,#fde68a,#facc15,#f59e0b);color:#1a1000;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:900;box-shadow:0 0 14px rgba(250,204,21,.55)}
  .badge-fire{background:rgba(0,0,0,.35);border:1px solid rgba(251,146,60,.6);color:#fdba74;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
  .icon-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .logo-wrap{margin:10px auto 4px;width:68px;height:68px;position:relative}
  .ring{position:absolute;inset:-8px;border:2px solid rgba(216,180,254,.85);border-radius:24px;transform:rotate(12deg);animation:spinSlow 9s linear infinite;box-shadow:0 0 12px rgba(168,85,247,.45)}
  .ring-out{position:absolute;inset:-16px;border:1.5px dashed rgba(34,211,238,.55);border-radius:28px;transform:rotate(-10deg);animation:spinSlowRev 14s linear infinite}
  @keyframes spinSlow{to{transform:rotate(372deg)}}
  @keyframes spinSlowRev{to{transform:rotate(-370deg)}}
  .logo{width:68px;height:68px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,#f5d0fe 0%, #e9d5ff 15%, #a855f7 40%, #6d28d9 75%, #3b0a6d 100%);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;box-shadow:0 0 22px #fff, 0 0 38px #a855f7, 0 0 70px #7c3aed, inset 0 2px 0 rgba(255,255,255,.7);border:2px solid rgba(255,255,255,.95);will-change:transform;transition:transform .25s, box-shadow .25s}
  .logo::after{content:"";position:absolute;top:-30%;left:-20%;width:70%;height:140%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:rotate(12deg) translateX(-120%);animation:gloss 4s ease-in-out infinite}
  @keyframes gloss{0%,55%{transform:rotate(12deg) translateX(-120%)}100%{transform:rotate(12deg) translateX(280%)}}
  body.typing .logo{transform:scale(1.08) translateY(-4px) rotate(-2deg);box-shadow:0 0 32px #fff, 0 0 55px #e879f9}
  body.typing .ring{animation-duration:1.4s;border-color:#fff}
  body.typing .ring-out{animation-duration:2s}
  body.answering .logo{transform:scale(1.05) translateY(-2px)}
  header h1{font-size:32px;letter-spacing:-.5px;line-height:1;font-weight:800}
  header h1 .grad{background:linear-gradient(90deg,#c084fc,#e9d5ff,#22d3ee,#f472b6,#c084fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .subtitle{font-size:12.5px;color:#d8b4fe;margin-top:4px}
  .chips{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap;min-height:32px}
  .chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
  .chip:active{transform:scale(.96)}
  .chip-tiktok{background:linear-gradient(135deg, rgba(168,85,247,.45), rgba(217,70,239,.45));border-color:#f0abfc}

  #chat{flex:1;overflow-y:auto;padding:14px 12px 12px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;position:relative;z-index:2;opacity:0;animation:fadeIn .35s ease 2.8s forwards}
  .row{display:flex;gap:9px;align-items:flex-start}
  .row.user{justify-content:flex-end}
  /* COLONNE AVATAR : L EN HAUT, EMOJI EN DESSOUS */
  .avatar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e9d5ff,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:2px solid #fff;flex-shrink:0}
  body.typing .avatar{box-shadow:0 0 16px #e879f9}
  .avatar.user-av{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border:2px solid #a5f3fc}
  .bot-mood{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid #e9d5ff;box-shadow:0 0 8px rgba(168,85,247,.6)}
  .msg{max-width:82%;padding:13px 15px;border-radius:20px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .bot-msg{background:linear-gradient(135deg, rgba(88,28,135,.92), rgba(76,29,149,.88));border:1px solid rgba(216,180,254,.6);box-shadow:0 8px 22px rgba(0,0,0,.3), 0 0 18px rgba(168,85,247,.35);border-bottom-left-radius:6px}
  .user-msg{background:linear-gradient(135deg,#8b5cf6,#a855f7);border:1px solid rgba(255,255,255,.25);border-bottom-right-radius:6px}
  .bot-msg b{color:#fff} .bot-msg code{background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;font-size:13px} .bot-msg pre{background:#000;padding:10px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:13px}
  .time{font-size:10px;color:rgba(255,255,255,.55);margin-top:5px;text-align:left;padding-left:2px}
  .actions{display:flex;gap:6px;margin-top:6px}
  .action-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;padding:5px 9px;border-radius:999px;cursor:pointer}
  .action-btn.active{background:#22c55e;border-color:#22c55e}
  .action-btn.active-red{background:#ef4444;border-color:#ef4444}

  #form{flex-shrink:0;padding:10px 12px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));position:relative;z-index:2;opacity:0;animation:fadeIn .35s ease 2.9s forwards}
  .input-wrap{display:flex;align-items:center;gap:10px;background:rgba(18,0,38,.9);border:1.5px solid rgba(216,180,254,.5);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 12px 28px rgba(0,0,0,.4), 0 0 22px rgba(168,85,247,.4)}
  body.typing .input-wrap{border-color:#f0abfc;box-shadow:0 0 22px rgba(217,70,239,.5)}
  #input{flex:1;background:transparent;border:none;color:#fff;padding:11px 4px;outline:none;font-size:16px;font-family:inherit}
  #input::placeholder{color:#c4b5fd}
  #send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#a855f7,#6366f1);border:none;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0;box-shadow:0 0 16px #a855f7}
  #send:active{transform:scale(.92)} #send:disabled{opacity:.5}
  .typing{opacity:.7;font-style:italic}
  .cursor{display:inline-block;width:8px;height:15px;background:#e9d5ff;vertical-align:middle;margin-left:2px;animation:blink .7s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .burst{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:99;animation:burstFly .6s ease-out forwards}
  @keyframes burstFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--bx), var(--by)) scale(0)}}
</style>
</head>
<body>

<div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div>
<div id="snowZone"></div>

<div id="splash">
  <div class="splash-center" id="splashCenter"><div class="halo"></div><div class="shock"></div><div class="ring2"></div><div class="ring1"></div><div class="splash-logo">L</div></div>
  <div class="splash-title"><span>L</span><span>u</span><span>m</span><span>y</span><span>G</span><span>P</span><span>T</span></div>
  <div class="splash-sub">Votre assistant intelligent</div><div class="splash-bar"><i></i></div>
</div>

<header>
  <div class="top-row">
    <div class="live"><i></i> En ligne</div>
    <div class="badges"><span class="badge">V24</span><span class="badge-gold">👑 PRO</span><span class="badge-fire" id="fireBadge">🔥 0</span><button class="icon-btn" id="themeBtn">🌙</button><button class="icon-btn" id="newBtn">🔄</button></div>
  </div>
  <div class="logo-wrap"><div class="ring-out"></div><div class="ring"></div><div class="logo">L</div></div>
  <h1>Lumy<span class="grad">GPT</span></h1>
  <div class="subtitle" id="subtitle">Votre assistant intelligent ✨</div>
  <div class="chips" id="chips">
    <button class="chip chip-tiktok" onclick="quickAsk('Donne-moi une idée de vidéo TikTok')">💡 Idée TikTok</button>
    <button class="chip" onclick="quickAsk('Aide-moi pour mon devoir')">📚 Aide devoir</button>
    <button class="chip" onclick="quickAsk('Raconte-moi une blague')">😂 Blague</button>
    <button class="chip" onclick="quickAsk('Fais-moi un planning de révision')">📅 Planning</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <div class="input-wrap">
    <input id="input" placeholder="Écris à LumyGPT..." autocomplete="off" />
    <button id="send" type="submit">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const splash = document.getElementById('splash');
const splashCenter = document.getElementById('splashCenter');
const fireBadge = document.getElementById('fireBadge');
const subtitle = document.getElementById('subtitle');
let currentMood = '😴';

const snowZone = document.getElementById('snowZone');
for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='snow'; const size=3+Math.random()*4; s.style.width=size+'px'; s.style.height=size+'px'; s.style.left=(Math.random()*100)+'%'; s.style.animationDuration=(7+Math.random()*6)+'s'; s.style.animationDelay=(Math.random()*7)+'s'; snowZone.appendChild(s); }

const colors = ['#e9d5ff','#a855f7','#facc15','#22d3ee','#fff','#c084fc'];
for(let i=0;i<14;i++){ const p=document.createElement('div'); p.className='particle'; const a=(i/14)*Math.PI*2; const d=110+Math.random()*70; p.style.setProperty('--x',Math.cos(a)*d+'px'); p.style.setProperty('--y',Math.sin(a)*d+'px'); splashCenter.appendChild(p); }
for(let i=0;i<14;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'%'; c.style.background=colors[i%colors.length]; c.style.animationDelay=(0.9+Math.random()*0.6)+'s'; splash.appendChild(c); }
setTimeout(()=>{ splash.style.display='none'; },3000);

const hour = new Date().getHours();
let greet = 'Bonjour ☀️', greetMsg = 'Bonjour 👋 Je suis LumyGPT, ton assistant intelligent.\nQue veux-tu faire aujourd\'hui ?';
if(hour >= 6 && hour < 12){ greet='Bonjour ☀️'; greetMsg='Bonjour ☀️ Je suis LumyGPT, bien réveillé pour toi.\nOn fait quoi ce matin ?'; }
else if(hour >= 12 && hour < 18){ greet='Bon après-midi ✨'; greetMsg='Bon après-midi ✨ Je suis LumyGPT.\nQue veux-tu faire ?'; }
else if(hour >= 18 && hour < 23){ greet='Bonsoir 🌙'; greetMsg='Bonsoir 🌙 Je suis LumyGPT.\nOn finit la journée en beauté ?'; }
else { greet='Bonne nuit 🌙'; greetMsg='Bonne nuit 🌙 Je suis LumyGPT, je veille pour toi.\nTu veux quoi ?'; }
subtitle.textContent = greet + ' • Ton assistant intelligent ✨';

let count = parseInt(localStorage.getItem('lumy_count') || '0');
function updateFire(){ fireBadge.textContent = '🔥 ' + count; }
updateFire();

// L'ÉMOTION EST MAINTENANT SOUS LE L QUI RÉPOND, PAS SUR LE GROS L EN HAUT
function setMood(emoji){
  currentMood = emoji;
  document.querySelectorAll('.bot-mood').forEach(el=>{ el.textContent = emoji; });
}
setTimeout(()=>{ setMood('👀'); }, 3200);

let audioCtx = null;
function playDing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    o.start(); o.stop(audioCtx.currentTime + 0.45);
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.frequency.value = 1320; o2.type = 'sine';
    g2.gain.setValueAtTime(0.08, audioCtx.currentTime + 0.08);
    g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    o2.start(audioCtx.currentTime + 0.08); o2.stop(audioCtx.currentTime + 0.5);
  }catch(e){}
}

const pool = [
  {e:'📚', t:'Aide devoir', q:'Aide-moi pour mon devoir'},
  {e:'😂', t:'Blague', q:'Raconte-moi une blague'},
  {e:'📅', t:'Planning', q:'Fais-moi un planning de révision'},
  {e:'🍕', t:'Idée repas', q:'Donne-moi une idée de repas'},
  {e:'💘', t:'Aide à draguer', q:'Aide-moi à draguer'},
  {e:'🎮', t:'Idée jeu', q:'Donne-moi une idée de jeu'},
  {e:'📖', t:'Histoire', q:'Raconte-moi une histoire'},
  {e:'🧠', t:'Quiz', q:'Fais-moi un quiz'},
  {e:'🎵', t:'Musique', q:'Conseille-moi une musique'},
  {e:'✍️', t:'Aide texte', q:'Aide-moi à écrire un texte'},
  {e:'💪', t:'Motivation', q:'Motive-moi'},
  {e:'🤔', t:'Devinette', q:'Dis-moi une devinette'},
];
const chipsEl = document.getElementById('chips');
function rotateChips(){
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0,3);
  chipsEl.innerHTML = '<button class="chip chip-tiktok" onclick="quickAsk(\'Donne-moi une idée de vidéo TikTok\')">💡 Idée TikTok</button>' + shuffled.map(c=>`<button class="chip" onclick="quickAsk('${c.q.replace(/'/g,"\\'")}')">${c.e} ${c.t}</button>`).join('');
}
setInterval(rotateChips, 10000);

const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{ document.body.classList.toggle('light'); themeBtn.textContent=document.body.classList.contains('light')?'🌞':'🌙'; };
document.getElementById('newBtn').onclick=()=>{ chat.innerHTML=''; setMood('👀'); addMsg(greetMsg, 'bot', true); };

let typingTimeout;
input.addEventListener('focus', ()=>{ document.body.classList.add('typing'); setMood('👀'); });
input.addEventListener('blur', ()=>{ if(!input.value){ document.body.classList.remove('typing'); setMood('😴'); } });
input.addEventListener('input', ()=>{
  if(input.value.trim().length > 0){
    document.body.classList.add('typing'); setMood('👀');
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{ document.body.classList.remove('typing'); setMood('😴'); }, 1800);
  } else { document.body.classList.remove('typing'); setMood('😴'); }
});

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatText(t){
  let s=escapeHtml(t);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/```[\s\S]*?```/g,(m)=>{ const clean=m.replace(/```\w*/,'').replace(/```/,'').trim(); return '<pre>'+clean+'</pre>'; });
  return s;
}
function timeNow(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function typeEffect(el, fullText){
  let i=0; el.innerHTML='';
  const iv=setInterval(()=>{
    i+=4; el.innerHTML=formatText(fullText.slice(0,i))+'<span class="cursor"></span>'; chat.scrollTop=chat.scrollHeight;
    if(i>=fullText.length){ clearInterval(iv); el.innerHTML=formatText(fullText); document.body.classList.remove('answering'); setMood('👀'); }
  },16);
}
function addMsg(text, who, instant=false){
  const row=document.createElement('div'); row.className='row '+(who==='user'?'user':'');
  if(who==='bot'){
    const col=document.createElement('div'); col.className='avatar-col';
    const av=document.createElement('div'); av.className='avatar'; av.textContent='L';
    const mood=document.createElement('div'); mood.className='bot-mood'; mood.textContent=currentMood;
    col.append(av); col.append(mood);
    const wrap=document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.maxWidth='84%';
    const div=document.createElement('div'); div.className='msg bot-msg';
    const t=document.createElement('div'); t.className='time'; t.textContent='LumyGPT • '+timeNow();
    const actions=document.createElement('div'); actions.className='actions';
    const copy=document.createElement('button'); copy.className='action-btn'; copy.textContent='📋 Copier';
    copy.onclick=()=>{ navigator.clipboard.writeText(text); copy.textContent='✅ Copié !'; setTimeout(()=>copy.textContent='📋 Copier',1500); };
    const like=document.createElement('button'); like.className='action-btn'; like.textContent='❤️';
    like.onclick=()=>{ 
      like.classList.toggle('active'); dislike.classList.remove('active-red');
      if(like.classList.contains('active')){ setMood('😍'); setTimeout(()=>setMood('👀'), 1500); }
    };
    const dislike=document.createElement('button'); dislike.className='action-btn'; dislike.textContent='👎';
    dislike.onclick=()=>{ dislike.classList.toggle('active-red'); like.classList.remove('active'); if(dislike.classList.contains('active-red')){ setMood('🥺'); setTimeout(()=>setMood('👀'), 1200); } };
    actions.append(copy,like,dislike);
    wrap.append(div); wrap.append(t); wrap.append(actions); row.append(col); row.append(wrap);
    chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
    if(instant){ div.innerHTML=formatText(text); } else { document.body.classList.add('answering'); setMood('🗣️'); typeEffect(div, text); playDing(); }
    return row;
  } else {
    const div=document.createElement('div'); div.className='msg user-msg'; div.innerHTML=formatText(text);
    const av=document.createElement('div'); av.className='avatar user-av'; av.textContent='Z';
    row.append(div); row.append(av); chat.appendChild(row); chat.scrollTop=chat.scrollHeight; return row;
  }
}
function quickAsk(q){ input.value=q; input.dispatchEvent(new Event('input')); form.dispatchEvent(new Event('submit')); }
addMsg(greetMsg, 'bot', true);

function burst(x, y){
  for(let i=0;i<10;i++){
    const b=document.createElement('div'); b.className='burst';
    b.style.left=x+'px'; b.style.top=y+'px';
    b.style.background=colors[i%colors.length];
    const ang=(i/10)*Math.PI*2; const dist=35+Math.random()*35;
    b.style.setProperty('--bx', Math.cos(ang)*dist+'px');
    b.style.setProperty('--by', Math.sin(ang)*dist+'px');
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 650);
  }
}

form.onsubmit=async(e)=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text) return;
  const rect = send.getBoundingClientRect();
  burst(rect.left + 23, rect.top + 23);
  document.body.classList.remove('typing'); setMood('🗣️');
  count++; localStorage.setItem('lumy_count', count); updateFire();
  addMsg(text,'user'); input.value=''; send.disabled=true;
  const typingRow=addMsg('LumyGPT écrit...','bot',true);
  typingRow.querySelector('.msg').classList.add('typing');
  document.body.classList.add('answering');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await r.json(); typingRow.remove(); document.body.classList.remove('answering'); addMsg(data.reply||'Pas de réponse bg, réessaie.','bot');
  }catch(err){ typingRow.remove(); document.body.classList.remove('answering'); addMsg('Erreur bg, réessaie.','bot'); }
  send.disabled=false;
};
</script>
